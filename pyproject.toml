[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-siting-engine"
version = "0.1.0"
description = "ANPC TLS Precision Siting and Obstacle Evaluation Engine"
authors = [{ name = "ANPC Engineering" }]
dependencies = [
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
